[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "occultation-media"
version = "1.3.2"
description = "Standalone synchronized occultation GIF and MP4 generator"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "Pillow>=10", "astropy>=6", "ravf==1.0.1", "Adv2==1.2.0", "opencv-python>=4.8,<5", "imageio-ffmpeg>=0.5,<1"]

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
occultation-media = "occultation_media.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
occultation_media = ["assets/fonts/*", "assets/licenses/*", "assets/licenses/*/*"]
