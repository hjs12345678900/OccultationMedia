name: Build standalone desktop packages
on:
  workflow_dispatch:
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m pip install -e ".[build]"
      - run: python build_tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: OccultationMedia-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/package-self-test.json
